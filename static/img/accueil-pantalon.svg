<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="titre desc">
  <title id="titre">Patron de pantalon dessiné à la main : devant, dos et ceinture</title>
  <desc id="desc">Illustration originale au trait, créée pour Studio Couture. Deux pièces de patron de pantalon et leur ceinture, avec marges de couture en pointillés et cotes indicatives.</desc>
  <rect x="8" y="8" width="624" height="504" rx="36" fill="#f7f4ef"/>
  <rect x="8" y="8" width="624" height="504" rx="36" fill="none" stroke="#c9a77c" stroke-width="2"/>

  <!-- Ceinture -->
  <g>
    <rect x="120" y="54" width="400" height="44" rx="6" fill="#ffffff" stroke="#23223a" stroke-width="2.5"/>
    <rect x="132" y="64" width="376" height="24" rx="4" fill="none" stroke="#23223a" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.65"/>
    <text x="320" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#23223a">CEINTURE</text>
  </g>

  <!-- Pièce devant (tracé original) -->
  <g>
    <path d="M150 128 L286 128 L292 218 C294 248 302 270 314 286 L292 452 L176 452 L156 288 C150 240 148 182 150 128 Z" fill="#ffffff" stroke="#23223a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M163 141 L274 141 L279 219 C281 244 287 262 297 276 L278 438 L188 438 L168 280 C163 236 161 186 163 141 Z" fill="none" stroke="#23223a" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.65"/>
    <path d="M262 132 C268 168 269 198 264 228" fill="none" stroke="#23223a" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.8"/>
    <text x="225" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#23223a">DEVANT</text>
    <!-- droit-fil -->
    <path d="M232 320 L232 420" stroke="#23223a" stroke-width="1.6"/>
    <path d="M227 330 L232 318 L237 330 M227 410 L232 422 L237 410" fill="none" stroke="#23223a" stroke-width="1.6"/>
  </g>

  <!-- Pièce dos (tracé original) -->
  <g>
    <path d="M354 128 L490 128 L494 186 C497 232 502 262 506 288 L492 452 L376 452 L362 286 C372 270 378 248 379 218 Z" fill="#dce5fa" stroke="#23223a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M367 141 L477 141 L481 188 C484 230 489 258 492 280 L480 438 L389 438 L376 278 C385 262 390 242 391 219 Z" fill="none" stroke="#23223a" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.65"/>
    <path d="M398 146 L404 196 L410 146" fill="none" stroke="#23223a" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.8"/>
    <text x="425" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#23223a">DOS</text>
    <path d="M430 320 L430 420" stroke="#23223a" stroke-width="1.6"/>
    <path d="M425 330 L430 318 L435 330 M425 410 L430 422 L435 410" fill="none" stroke="#23223a" stroke-width="1.6"/>
  </g>

  <!-- Cotes indicatives (aucune mesure réelle) -->
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#c2410c"/>
    </marker>
  </defs>
  <g stroke="#c2410c" stroke-width="1.6">
    <path d="M150 112 L286 112" marker-start="url(#fleche)" marker-end="url(#fleche)"/>
    <path d="M110 128 L110 452" marker-start="url(#fleche)" marker-end="url(#fleche)"/>
    <path d="M176 472 L292 472" marker-start="url(#fleche)" marker-end="url(#fleche)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#c2410c">
    <rect x="178" y="100" width="80" height="22" rx="11" fill="#ffffff" stroke="#c2410c" stroke-width="1.1"/>
    <text x="218" y="115" text-anchor="middle">Taille</text>
    <rect x="52" y="278" width="116" height="22" rx="11" fill="#ffffff" stroke="#c2410c" stroke-width="1.1" transform="rotate(-90 110 289)"/>
    <text x="110" y="293" text-anchor="middle" transform="rotate(-90 110 289)">Longueur</text>
    <rect x="194" y="461" width="80" height="22" rx="11" fill="#ffffff" stroke="#c2410c" stroke-width="1.1"/>
    <text x="234" y="476" text-anchor="middle">Bas</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#23223a">
    <path d="M366 492 L402 492" stroke="#23223a" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="410" y="496">marge de couture</text>
  </g>
</svg>
